apiVersion: apps/v1
kind: Deployment

metadata:
  name: podinfo
  labels:
    app: podinfo

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: podinfo

  template:
    metadata:
      labels:
        app: podinfo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"

    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9898
            - name: metrics
              containerPort: 9797

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi