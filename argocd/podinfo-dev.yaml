apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: podinfo-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/FAHID-KHAN/Homelab-platformOps.git
    targetRevision: dev/v1
    path: applications/podinfo/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-dev

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true